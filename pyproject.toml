[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bicentennial-man"
version = "0.3.0"
description = "Phenotype-first developmental and evolutionary laboratory for persistent artificial characters"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bicentennial = "bicentennial_man.cli:main"
bicentennial-lab = "bicentennial_man.phenotype_cli:main"
bicentennial-baseline = "bicentennial_man.baseline_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
